# Native platform gates: Windows TUI/operator with PowerShell 7 and Job Objects;
# macOS CLI/TUI/server with the existing process fallback. Linux DAG execution
# remains covered by the workspace and container acceptance checks.
name: platform

on:
  push:
    branches: [main, "windows11/**"]
    # Intentionally broad: the non-Linux closure spans 14 crates (core, llm,
    # store, shellguard, dag, node, agents, brain, control, todos, session,
    # cli, tui, server + workspace root), and a narrower per-crate filter
    # once missed exactly this gate's recurrence channel. Changes to the
    # Linux-only crates merely cost a redundant green run.
    paths:
      - "crates/**"
      - "AGENTS.md"
      - "repo-memory.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "scripts/install.ps1"
      - "scripts/platform/release/build-windows.ps1"
      - "scripts/platform/windows/**"
      - "docs/windows.md"
      - ".github/workflows/platform.yml"
  pull_request:
    # Intentionally broad: the non-Linux closure spans 14 crates (core, llm,
    # store, shellguard, dag, node, agents, brain, control, todos, session,
    # cli, tui, server + workspace root), and a narrower per-crate filter
    # once missed exactly this gate's recurrence channel. Changes to the
    # Linux-only crates merely cost a redundant green run.
    paths:
      - "crates/**"
      - "AGENTS.md"
      - "repo-memory.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - "scripts/install.ps1"
      - "scripts/platform/release/build-windows.ps1"
      - "scripts/platform/windows/**"
      - "docs/windows.md"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

# Least privilege; newer runs on the same ref supersede stale ones.
permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: windows x64 (TUI / operator)
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh
    env:
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: PowerShell 7 and native build dependencies
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 7 -or $PSVersionTable.PSVersion -lt [version]'7.4') { throw 'Stable PowerShell 7.4 or newer required' }
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake required' }
          if (-not (Test-Path "$env:LIBCLANG_PATH/libclang.dll")) { throw 'LLVM libclang required' }
          git --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Git required' }
          if (-not (Get-Command rg -CommandType Application -ErrorAction SilentlyContinue)) {
            choco install ripgrep --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Native ripgrep installation failed' }
          }
          rg --version
          if ($LASTEXITCODE -ne 0) { throw 'Native ripgrep required for read-only execution tests' }
      - name: check supported packages and test targets
        run: cargo check --locked -p opencoder -p opencoder-agent -p opencoder-core -p opencoder-session -p opencoder-tui -p opencoder-worker --all-targets
      - name: build native programs and test supervisor
        run: cargo build --locked -p opencoder -p opencoder-agent -p opencoder-session
      - name: clippy
        run: cargo clippy --locked -p opencoder -p opencoder-agent -p opencoder-core -p opencoder-session -p opencoder-tui -p opencoder-worker --all-targets -- -D warnings
      - name: shared platform contracts
        run: |
          $log = "$env:RUNNER_TEMP/platform-contracts.log"
          & cargo test --locked -p opencoder-core -p opencoder-session -p opencoder-tui -p opencoder-worker --lib 2>&1 | Tee-Object -FilePath $log
          $result = $LASTEXITCODE
          if ($result -ne 0) {
            $tail = [string](@(Get-Content $log -Tail 120) -join "`n")
            $annotation = $tail.Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
            Write-Output "::error title=Windows platform contract failure::$annotation"
            @('### Windows platform contract failure', '```text', $tail, '```') | Add-Content $env:GITHUB_STEP_SUMMARY
          }
          exit $result
      - name: embedded database teardown and native file ownership
        run: cargo test --locked -p opencoder-store --test connection_lifecycle
      - name: Windows private ACL and durable files
        run: cargo test --locked -p opencoder-core --test platform_fs
      - name: Windows process trees, PowerShell and Codex
        run: cargo test --locked -p opencoder-session --test windows_native
      - name: Windows operator admission, execution and recovery
        run: cargo test --locked -p opencoder-worker --test windows_operator
      - name: Windows TUI commands
        run: cargo test --locked -p opencoder --test windows_tui
      - name: build Windows release ZIP
        run: ./scripts/platform/release/build-windows.ps1 -Output "$env:RUNNER_TEMP/opencoder-windows-x64.zip"
      - name: installer acceptance
        run: |
          Expand-Archive "$env:RUNNER_TEMP/opencoder-windows-x64.zip" "$env:RUNNER_TEMP/opencoder-package"
          ./scripts/platform/windows/installer-tests.ps1 -BinaryDirectory "$env:RUNNER_TEMP/opencoder-package/bin"
      - name: durable installer recovery transitions
        run: ./scripts/platform/windows/installer-state-tests.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-windows-x64
          path: |
            ${{ runner.temp }}/opencoder-windows-x64.zip
            ${{ runner.temp }}/opencoder-windows-x64.zip.sha256
  macos:
    name: macos gate (opencoder / opencoder-server)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # libsql's libsql-ffi needs cmake (and libclang from the Command Line
      # Tools) to build on macOS; the runner image does not ship cmake.
      - name: install cmake (libsql-ffi build dependency)
        run: brew install cmake

      - name: check (non-Linux closure compiles)
        run: cargo check -p opencoder -p opencoder-server

      - name: clippy
        run: cargo clippy -p opencoder -p opencoder-server --all-targets -- -D warnings

      - name: session tests (fallback contract + portable behavior)
        shell: bash
        run: |
          set +e
          cargo test -p opencoder-session 2>&1 | tee "$RUNNER_TEMP/session-tests.log" | awk '{print; if (/has been running for over/) print "::warning title=Slow session test::" $0; fflush()}'
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            {
              failure=$(tail -n 45 "$RUNNER_TEMP/session-tests.log" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              printf '::error title=Session test failure::%s\n' "$failure" >&2
              echo '### Session test failure'
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/session-tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
