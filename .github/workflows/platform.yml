# Native platform gates: macOS CLI/TUI/server with the existing process
# fallback. Linux DAG execution remains covered by the workspace and container
# acceptance checks. Windows is not covered for now.
name: platform

on:
  push:
    branches: [main]
    # Intentionally broad: the non-Linux closure spans 14 crates (core, llm,
    # store, shellguard, dag, node, agents, brain, control, todos, session,
    # cli, tui, server + workspace root), and a narrower per-crate filter
    # once missed exactly this gate's recurrence channel. Changes to the
    # Linux-only crates merely cost a redundant green run.
    paths:
      - "crates/**"
      - "AGENTS.md"
      - "repo-memory.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - ".github/workflows/platform.yml"
  pull_request:
    # Intentionally broad: the non-Linux closure spans 14 crates (core, llm,
    # store, shellguard, dag, node, agents, brain, control, todos, session,
    # cli, tui, server + workspace root), and a narrower per-crate filter
    # once missed exactly this gate's recurrence channel. Changes to the
    # Linux-only crates merely cost a redundant green run.
    paths:
      - "crates/**"
      - "AGENTS.md"
      - "repo-memory.md"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "src/**"
      - "tests/**"
      - ".github/workflows/platform.yml"
  workflow_dispatch:

# Least privilege; newer runs on the same ref supersede stale ones.
permissions:
  contents: read

concurrency:
  group: platform-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    name: macos gate (opencoder / opencoder-server)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # The native store backend needs cmake (and libclang from the Command
      # Line Tools) to build on macOS; the runner image does not ship cmake.
      - name: install cmake (native build dependency)
        run: brew install cmake

      - name: check (non-Linux closure compiles)
        run: cargo check -p opencoder -p opencoder-server

      - name: clippy
        run: cargo clippy -p opencoder -p opencoder-server --all-targets -- -D warnings

      - name: configuration overlays and memory seed contracts
        run: cargo test --locked -p opencoder-core --test config_overlay --test skill_contract

      - name: session tests (fallback contract + portable behavior)
        shell: bash
        run: |
          set +e
          cargo test -p opencoder-session 2>&1 | tee "$RUNNER_TEMP/session-tests.log" | awk '{print; if (/has been running for over/) print "::warning title=Slow session test::" $0; fflush()}'
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            {
              failure=$(tail -n 45 "$RUNNER_TEMP/session-tests.log" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
              printf '::error title=Session test failure::%s\n' "$failure" >&2
              echo '### Session test failure'
              echo '```text'
              tail -n 200 "$RUNNER_TEMP/session-tests.log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"
