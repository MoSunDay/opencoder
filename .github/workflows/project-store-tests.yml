name: project-store-tests

on:
  push:
    branches: [main]
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/project-store-tests.yml']
  pull_request:
    paths: ['crates/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/project-store-tests.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-store-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'

jobs:
  libsql:
    name: libsql project store contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config
      - name: Project persistence, transactions and recovery
        shell: bash
        run: |
          set +e
          cargo test --locked -p opencoder-store 2>&1 | tee "$RUNNER_TEMP/libsql-tests.log"
          result=${PIPESTATUS[0]}
          set -e
          if [ "$result" -ne 0 ]; then
            failure=$(tail -n 60 "$RUNNER_TEMP/libsql-tests.log" | sed 's/%/%25/g; s/\r/%0D/g' | awk '{printf "%s%%0A", $0}')
            printf '::error title=libsql contract failure::%s\n' "$failure"
          fi
          exit "$result"
      - name: Preserve libsql test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: libsql-project-tests
          path: ${{ runner.temp }}/libsql-tests.log
          if-no-files-found: error
          retention-days: 7

  lint:
    name: fmt + clippy (store / project)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Native build dependencies
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
