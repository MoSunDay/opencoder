# GitHub Release pipeline: build the auditable platform bundles on the two
# supported release platforms (Linux x86_64 and macOS aarch64), publish every
# archive with its checksum. Each bundle comes from
# scripts/platform/release/build.sh: clean tree, --locked dependencies, compiled
# build metadata, SPA digest, manifest.json and SHA256SUMS.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The macOS runner image does not ship cmake; some storage build paths
      # still probe it. Harmless when unused.
      - name: install cmake
        if: runner.os == 'macOS'
        run: brew install cmake

      - name: build release bundle
        shell: bash
        run: scripts/platform/release/build.sh --output "$RUNNER_TEMP/bundle"

      - name: archive and checksum
        shell: bash
        id: archive
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/ {print $2; exit}' Cargo.toml)"
          asset="opencoder-${version}-${{ matrix.platform }}.tar.gz"
          tar -czf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bundle" .
          (
            cd "$RUNNER_TEMP"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" >"$asset.sha256"
            else
              shasum -a 256 "$asset" >"$asset.sha256"
            fi
          )
          mkdir -p "$RUNNER_TEMP/assets"
          mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" "$RUNNER_TEMP/assets/"
          echo "asset=$asset" >>"$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish github release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: verify checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: artifacts
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            --title "opencoder $GITHUB_REF_NAME" \
            --generate-release-notes \
            --verify-tag \
            --clobber \
            ./*
