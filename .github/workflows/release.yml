# GitHub Release pipeline: build the auditable platform bundles on the two
# supported release platforms (Linux x86_64 and macOS aarch64), publish every
# archive with its checksum. Each bundle comes from
# scripts/platform/release/build.sh: clean tree, --locked dependencies, compiled
# build metadata, SPA digest, manifest.json and SHA256SUMS.
name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # A re-pushed tag supersedes the previous run for the same tag.
  cancel-in-progress: true

jobs:
  bundle:
    name: bundle (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-aarch64
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Match the Node major that produced the committed crates/web/spa/dist so
      # the release-time SPA drift gate stays byte-reproducible.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: crates/web/spa/package-lock.json

      # Native build dependencies: bindgen needs libclang, some storage build
      # paths probe cmake. The macOS image ships no cmake either.
      - name: install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          case "$(uname -s)" in
            Linux) sudo apt-get update && sudo apt-get install -y libclang-dev cmake pkg-config ;;
            Darwin) brew install cmake ;;
            *) echo "unsupported runner: $(uname -s)" >&2; exit 1 ;;
          esac

      - name: verify runner architecture
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.platform }}" in
            linux-x86_64) expect=x86_64 ;;
            macos-aarch64) expect=arm64 ;;
            *) echo "unknown platform label" >&2; exit 1 ;;
          esac
          actual="$(uname -m)"
          [[ "$actual" == "$expect" ]] || { echo "runner arch $actual != $expect" >&2; exit 1; }

      # Reject a mistyped tag before spending a full Rust build on it.
      - name: verify tag matches workspace version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/ {print $2; exit}' Cargo.toml)"
          [[ -n "$version" ]] || { echo "workspace version not found" >&2; exit 1; }
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            [[ "$GITHUB_REF_NAME" == "v$version" ]] || {
              echo "tag $GITHUB_REF_NAME does not match workspace version v$version" >&2
              exit 1
            }
          fi

      - name: build release bundle
        shell: bash
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/build.log"
          scripts/platform/release/build.sh --output "$RUNNER_TEMP/bundle" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### build.sh failed (exit $status)"
              echo '```text'
              tail -n 120 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 "$log" \
              | sed 's/%/%25/g; s/\r/%0D/g; s/::/:/g' \
              | awk '{printf "%s%%0A", $0}' \
              | cut -c1-3000 > "$RUNNER_TEMP/tail.txt"
            echo "::error title=build.sh failed (exit $status)::$(cat "$RUNNER_TEMP/tail.txt")"
            exit "$status"
          fi

      - name: archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk -F'"' '/^version = "/ {print $2; exit}' Cargo.toml)"
          [[ -n "$version" ]] || { echo "workspace version not found" >&2; exit 1; }
          asset="opencoder-${version}-${{ matrix.platform }}.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/bundle" .
          (
            cd "$RUNNER_TEMP"
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$asset" >"$asset.sha256"
            else
              shasum -a 256 "$asset" >"$asset.sha256"
            fi
          )
          mkdir -p "$RUNNER_TEMP/assets"
          mv "$RUNNER_TEMP/$asset" "$RUNNER_TEMP/$asset.sha256" "$RUNNER_TEMP/assets/"

      - uses: actions/upload-artifact@v4
        with:
          name: opencoder-${{ matrix.platform }}
          path: ${{ runner.temp }}/assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: publish github release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: verify checksums
        working-directory: artifacts
        run: sha256sum -c ./*.sha256

      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        working-directory: artifacts
        run: |
          set -uo pipefail
          log="$RUNNER_TEMP/release.log"
          notes="$RUNNER_TEMP/notes.md"
          cat >"$notes" <<NOTES
          Platform bundles built from commit ${GITHUB_SHA}.

          - opencoder-${GITHUB_REF_NAME#v}-linux-x86_64.tar.gz (+ .sha256)
          - opencoder-${GITHUB_REF_NAME#v}-macos-aarch64.tar.gz (+ .sha256)

          Each archive carries bin/, manifest.json and SHA256SUMS.
          Changelog (feature to test mapping): https://github.com/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/features/changelog
          Verify an archive with: sha256sum -c <archive>.sha256
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            --title "opencoder $GITHUB_REF_NAME" \
            --notes-file "$notes" \
            --verify-tag \
            ./* 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          # A retry after a partial publish must replace the assets instead of
          # failing on the existing release.
          if [ "$status" -ne 0 ] && gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --clobber
            status=$?
          fi
          if [ "$status" -ne 0 ]; then
            tail -n 80 "$log" \
              | sed 's/%/%25/g; s/\r/%0D/g; s/::/:/g' \
              | awk '{printf "%s%%0A", $0}' \
              | cut -c1-3000 > "$RUNNER_TEMP/tail.txt"
            echo "::error title=gh release failed (exit $status)::$(cat "$RUNNER_TEMP/tail.txt")"
            {
              echo "### release failed (exit $status)"
              echo '```text'
              tail -n 80 "$log"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi
