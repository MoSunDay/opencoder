[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/shellguard",
    "crates/llm",
    "crates/store",
    "crates/session",
    "crates/tui",
    "crates/web",
    "crates/cli",
    "crates/todos",
    "crates/node",
]

[package]
name = "opencoder"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "opencoder"
path = "src/main.rs"

[dependencies]
opencoder-cli.workspace = true
opencoder-tui.workspace = true
opencoder-core.workspace = true
opencoder-session.workspace = true
opencoder-node.workspace = true
clap.workspace = true
tokio.workspace = true
anyhow.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["opencoder"]
license = "MIT"

[workspace.dependencies]
opencoder-core   = { path = "crates/core" }
opencoder-llm    = { path = "crates/llm" }
opencoder-store  = { path = "crates/store" }
opencoder-session = { path = "crates/session" }
opencoder-shellguard = { path = "crates/shellguard" }
opencoder-tui    = { path = "crates/tui" }
opencoder-web    = { path = "crates/web" }
opencoder-client  = { path = "crates/client" }
opencoder-cli    = { path = "crates/cli" }
opencoder-todos  = { path = "crates/todos" }
opencoder-node   = { path = "crates/node" }

tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tokio-util = "0.7"
futures = "0.3"
async-trait = "0.1"
libsql = { version = "0.9.30", default-features = false, features = ["core", "libsql-sys", "parser", "serde"] }
tempfile = "3"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "gzip", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
ulid = { version = "1", features = ["serde"] }
dirs = "5"
glob = "0.3"
regex = "1"
uuid = { version = "1", features = ["v4"] }
pulldown-cmark = { version = "0.13", default-features = false }
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
arboard = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
