[package]
name = "opencoder-control"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# External SQLite-format resources are inspected only in disposable read-only
# copies, opened with the same pure-Rust engine as the application database.
turso.workspace = true
tempfile.workspace = true
fs2 = "0.4"
libc = "0.2"
tokio-util = { workspace = true, features = ["io"] }
http-body = "1"
opencoder-core.workspace = true
opencoder-ontology.workspace = true
opencoder-store.workspace = true
opencoder-brain.workspace = true
opencoder-agents.workspace = true
opencoder-dag.workspace = true
opencoder-dag-binary.workspace = true
opencoder-todos = { path = "../todos", default-features = false }
opencoder-llm.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
chrono.workspace = true
ulid.workspace = true
uuid.workspace = true
base64.workspace = true
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
dirs.workspace = true
axum = { version = "0.7", features = ["ws"] }
reqwest.workspace = true

[dev-dependencies]
tokio-stream.workspace = true
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
tower = { version = "0.5", features = ["util"] }
# TLS-termination harness for the wss channel suite: a generated CA trusted
# through `SSL_CERT_FILE` (the native-roots path production nodes use) and a
# rustls acceptor driving the Server router over hyper http1 (with upgrades
# for the WebSocket route). ring-only features keep the build aws-lc-free.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
hyper = { version = "1.10", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "0.1", default-features = false, features = ["tokio", "service"] }
opencoder-node.workspace = true
