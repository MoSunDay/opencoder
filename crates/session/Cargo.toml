[package]
name = "opencoder-session"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencoder-core.workspace = true
opencoder-llm.workspace = true
opencoder-shellguard.workspace = true
opencoder-store.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-util = { workspace = true, features = ["rt"] }
futures.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
dirs.workspace = true
libc = "0.2"
# Ripgrep in-process search engine for the `search` tool: no external `rg` binary needed.
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
ulid.workspace = true
base64.workspace = true

[[bin]]
name = "mcp_mock_server"
path = "bin/mcp_mock_server.rs"

[dev-dependencies]
tempfile.workspace = true
