[package]
name = "opencoder-store"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencoder-core.workspace = true
opencoder-dag.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
tokio.workspace = true
async-trait.workspace = true
libsql.workspace = true
ulid.workspace = true

# Optional project-data backends. StarRocks speaks the MySQL wire protocol,
# so both map to the same sqlx mysql driver; the feature choice only records
# intent for DDL/tx behavior branching. Untyped `sqlx::query` only — the
# macros feature is deliberately NOT enabled (it would require a
# compile-time database URL); rustls, never native-tls/openssl.
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "mysql"], optional = true }

[dev-dependencies]
tempfile.workspace = true
libsql.workspace = true

[[test]]
name = "bounded_pagination"
path = "tests/contracts/bounded_pagination.rs"

[[test]]
name = "fleet_report"
path = "tests/contracts/fleet_report.rs"

[[test]]
name = "fleet_schema"
path = "tests/contracts/fleet_schema.rs"

[[test]]
name = "input_idempotency"
path = "tests/contracts/input_idempotency.rs"

[[test]]
name = "project_atomic_claim"
path = "tests/contracts/project_atomic_claim.rs"

[features]
default = []
mysql = ["dep:sqlx"]
starrocks = ["dep:sqlx"]
