<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>opencoder · sessions</title>
  <!--STYLES-->
</head>
<body>
  <aside id="side">
    <div class="hdr"><span>opencoder</span><button class="new" onclick="newSession()">+ new</button></div>
    <input id="search" type="text" placeholder="search sessions..." autocomplete="off"/>
    <div id="sess-list"></div>
  </aside>
  <main id="main">
    <div id="top">
      <span class="id" id="cur-id"></span>
      <select id="mode" title="agent/mode" onchange="switchAgent()">
        <option value="act">act</option>
        <option value="plan">plan</option>
      </select>
      <select id="model-select" title="model" onchange="onModelSelect()"></select>
      <input id="model" type="text" placeholder="custom model" onchange="switchModel()" style="display:none"/>
      <button onclick="forkSession()">fork</button>
      <button onclick="compactSession()">compact</button>
      <button class="danger" onclick="delSession(currentId())">delete</button>
      <button id="qtoggle" title="pending inputs" onclick="toggleQueuePanel()">queue (<span id="qcount">0</span>)</button>
      <span id="reconnect" style="display:none">reconnecting...</span>
      <button id="gear" title="settings" onclick="toggleSettings()">&#x2699;</button>
      <div id="settings-pop" style="display:none">
        <div class="sp-row">
          <label>autopilot</label>
          <select id="autopilot" onchange="switchAutopilot()">
            <option value="">follow config</option>
            <option value="off">off</option>
            <option value="ap">ap</option>
            <option value="review">review</option>
          </select>
        </div>
        <div class="sp-row">
          <label>annotation</label>
          <textarea id="annotation" rows="2" placeholder="session requirement / note..."></textarea>
        </div>
        <div class="sp-row sp-actions">
          <button onclick="saveAnnotation()">save note</button>
          <button onclick="clearAnnotation()">clear</button>
          <button id="handoff" onclick="handoffSession()">handoff</button>
        </div>
      </div>
    </div>
    <div id="reconnect-fail" style="display:none">stream reconnect failed &mdash; <a href="javascript:location.reload()">reload</a></div>
    <div id="log-wrap">
      <div id="log"></div>
      <div id="hero">
        <h2>opencoder</h2>
        <div class="hint">Enter = steer the running turn &middot; Shift+Enter = queue for the next idle</div>
        <div class="hint">type <b>$</b> to attach a skill &middot; &#x1f4ce; attaches images &middot; Esc interrupts</div>
        <div class="hint">plan mode ends with a handoff card &middot; tokens show under each turn</div>
        <div class="hero-ex">
          <button data-prompt="Summarize this repository's structure and the role of each crate.">explore this repo</button>
          <button data-prompt="Draft a step-by-step plan to add a /api/stats endpoint to the web crate.">plan a feature</button>
          <button data-prompt="Run the web crate's test suite and report any failures.">run the tests</button>
        </div>
      </div>
    </div>
    <div id="questions"></div>
    <div id="composer">
      <div class="composer-col">
        <div id="skill-chip" style="display:none"></div>
        <textarea id="msg" rows="1" placeholder="Send a message...  (Enter=steer, Shift+Enter=queue, Esc=interrupt, $=skill)"></textarea>
        <div id="img-preview"></div>
        <div id="skill-pop" style="display:none"></div>
      </div>
      <div class="composer-side">
        <label class="clip" title="attach image">&#x1f4ce;<input type="file" accept="image/*" multiple onchange="handleFileSelect(event)"/></label>
        <button id="send" onclick="send('steer')">Send</button>
      </div>
    </div>
  </main>
  <aside id="qpanel" style="display:none">
    <div class="qp-hdr"><span>pending inputs</span><button onclick="toggleQueuePanel()" title="close">&#x2715;</button></div>
    <div id="qp-list"></div>
  </aside>
  <!--JS_API-->
  <!--JS_SSE-->
  <!--JS_SESSIONS-->
  <!--JS_CHAT-->
  <!--JS_COMPOSER-->
  <!--JS_QUESTIONS-->
  <!--JS_QUEUE-->
  <!--JS_SETTINGS-->
</body>
</html>
