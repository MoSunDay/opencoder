[package]
name = "opencoder-worker"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
opencoder-agents.workspace = true
opencoder-core.workspace = true
opencoder-brain.workspace = true
opencoder-node.workspace = true
opencoder-web.workspace = true
opencoder-session.workspace = true
opencoder-store.workspace = true
opencoder-llm.workspace = true
opencoder-team.workspace = true
opencoder-todos.workspace = true
opencoder-project.workspace = true
opencoder-dag.workspace = true
opencoder-dag-binary.workspace = true
base64.workspace = true
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
futures.workspace = true
tracing.workspace = true
ulid.workspace = true
axum = { version = "0.7", features = ["ws"] }
tower = { version = "0.5", features = ["util"] }
fs2 = "0.4"
sha2 = "0.10"
libc = "0.2"

[target.'cfg(not(windows))'.dependencies]
opencoder-dag-runtime.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[target.'cfg(not(windows))'.dev-dependencies]
opencoder-control.workspace = true

[dev-dependencies]
tempfile.workspace = true
reqwest.workspace = true

[[test]]
name = "platform"
path = "tests/platform/main.rs"

[[test]]
name = "drain_health"
path = "tests/drain_health/main.rs"

[[test]]
name = "durable_execution"
path = "tests/durable_execution/main.rs"

[[test]]
name = "durable_lifecycle"
path = "tests/durable_lifecycle/main.rs"

[[test]]
name = "internal_session_index"
path = "tests/internal_session_index/main.rs"
