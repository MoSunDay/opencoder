map $http_upgrade $opencoder_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name opencoder.internal.example;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name opencoder.internal.example;

    # Install a full chain issued by the organization's native trusted CA.
    ssl_certificate     /etc/nginx/tls/opencoder.fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/opencoder.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $opencoder_connection_upgrade;

        # SSE, streamed artifacts and the Node WebSocket must not be buffered.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        add_header X-Accel-Buffering no always;
    }
}
