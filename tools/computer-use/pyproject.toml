[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opencoder-computer"
version = "0.1.0"
description = "Optional Cua computer-use CLI for OpenCoder"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
  "cua-agent[qwen] @ git+https://github.com/trycua/cua.git@9545a3d17b44b587b593d59090dc140740876a6e#subdirectory=libs/python/agent",
  "cua-computer @ git+https://github.com/trycua/cua.git@9545a3d17b44b587b593d59090dc140740876a6e#subdirectory=libs/python/computer",
  "numpy>=1.26,<3",
  "torch>=2.6,<3",
  "torchvision>=0.21,<1",
  "soundfile>=0.13,<1",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.11,<1"]

[project.scripts]
opencoder-computer = "opencoder_computer.cli:main"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/opencoder_computer"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
